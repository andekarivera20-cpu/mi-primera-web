name: Build Manager Career Manager Map

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-manager-career-managers.yml'
      - 'manager-career/data/clubs-lite.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Complete current manager map
        run: |
          python - <<'PY'
          import json, re, time, unicodedata, urllib.request, urllib.parse, html as htmlmod
          from difflib import SequenceMatcher
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          clubs_data=json.loads(Path('manager-career/data/clubs-lite.json').read_text(encoding='utf-8'))
          all_clubs=[row[0] for rows in clubs_data.get('leagues',{}).values() for row in rows]
          valid=set(all_clubs)

          map_path=Path('manager-career/data/manager-map.json')
          old=json.loads(map_path.read_text(encoding='utf-8')) if map_path.exists() else {'managers':{}}
          managers={k:v for k,v in (old.get('managers') or {}).items()
                    if k in valid and v and v!='Entrenador actual'}

          # Verified/current overrides for important unresolved clubs.
          managers.update({
            'Athletic Club':'Edin Terzić',
            'Arsenal FC':'Mikel Arteta',
            'FC Barcelona':'Hansi Flick',
            'Chelsea FC':'Xabi Alonso',
            'Crystal Palace':'Pierre Sage',
            'Everton FC':'David Moyes',
            'Manchester City':'Enzo Maresca'
          })

          def norm(s):
              s=unicodedata.normalize('NFKD',s or '').encode('ascii','ignore').decode().lower()
              s=s.replace('&',' and ').replace("'",'')
              s=re.sub(r'\b(football club|futbol club|futebol clube|club de futbol|club|fc|cf|sc|ac|afc|rcd|rc|cd|ud|sv|vfb|vfl|calcio)\b',' ',s)
              s=re.sub(r'\b(18|19|20)\d{2}\b',' ',s)
              s=re.sub(r'[^a-z0-9]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()

          def score(a,b):
              A,B=norm(a),norm(b)
              if not A or not B:return 0
              if A==B:return 1
              if A in B or B in A:return .88+.1*min(len(A),len(B))/max(len(A),len(B))
              return SequenceMatcher(None,A,B).ratio()

          def get(url,timeout=30):
              req=urllib.request.Request(url,headers={
                  'User-Agent':'Mozilla/5.0 ManagerCareer/1.0 (educational project)',
                  'Accept':'application/json,text/plain,*/*'
              })
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read().decode('utf-8','replace')

          def clean_value(v):
              v=re.sub(r'<ref[^>]*>.*?</ref>','',v,flags=re.I|re.S)
              v=re.sub(r'<ref[^>]*/>','',v,flags=re.I)
              v=re.sub(r'\[\[([^\]|]+)\|([^\]]+)\]\]',r'\2',v)
              v=re.sub(r'\[\[([^\]]+)\]\]',r'\1',v)
              for _ in range(6):
                  nv=re.sub(r'\{\{[^{}]*?\|\s*([^{}|]+)\}\}',lambda m:m.group(1),v)
                  if nv==v:break
                  v=nv
              v=re.sub(r'\{\{[^{}]+\}\}','',v)
              v=re.sub(r'<[^>]+>','',v)
              v=htmlmod.unescape(v.replace("'''",'').replace("''",''))
              return re.sub(r'\s+',' ',v).strip(' |')

          def manager_from_wikitext(text):
              keys=('manager','head coach','head_coach','coach','entrenador')
              for raw in text.splitlines():
                  line=raw.strip()
                  if not line.startswith('|') or '=' not in line:continue
                  key,val=line[1:].split('=',1)
                  if key.strip().lower() in keys:
                      name=clean_value(val)
                      if name and 2<len(name)<100 and name.lower() not in ('vacant','none','n/a','-','tbd'):
                          return name
              return None

          def wikipedia_search(club,lang):
              host='en.wikipedia.org' if lang=='en' else 'es.wikipedia.org'
              queries=[club+' football club',club]
              for q in queries:
                  try:
                      surl='https://'+host+'/w/api.php?action=query&format=json&list=search&srlimit=5&srsearch='+urllib.parse.quote(q)
                      hits=json.loads(get(surl)).get('query',{}).get('search',[])
                      for hit in hits:
                          title=hit.get('title') or ''
                          if not title:continue
                          sc=score(club,title)
                          if sc<.42 and norm(club) not in norm(title) and norm(title) not in norm(club):continue
                          purl='https://'+host+'/w/api.php?action=query&format=json&formatversion=2&prop=revisions&rvprop=content&rvslots=main&titles='+urllib.parse.quote(title)
                          pages=json.loads(get(purl)).get('query',{}).get('pages',[])
                          if not pages:continue
                          revs=pages[0].get('revisions') or []
                          if not revs:continue
                          slots=revs[0].get('slots') or {}
                          text=(slots.get('main') or {}).get('content') or revs[0].get('*') or ''
                          name=manager_from_wikitext(text)
                          if name:return name
                  except Exception:
                      pass
              return None

          def wikidata_manager(club):
              try:
                  url='https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&language=en&limit=6&search='+urllib.parse.quote(club)
                  results=json.loads(get(url)).get('search',[])
                  chosen=None;best=0
                  for item in results:
                      label=item.get('label') or ''
                      desc=(item.get('description') or '').lower()
                      sc=score(club,label)
                      if ('football' in desc or 'soccer' in desc or sc>.92) and sc>best:
                          chosen=item.get('id');best=sc
                  if not chosen or best<.55:return None
                  eurl='https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&props=claims&ids='+urllib.parse.quote(chosen)
                  obj=json.loads(get(eurl)).get('entities',{}).get(chosen,{})
                  claims=(obj.get('claims') or {}).get('P286') or []
                  active=[]
                  for c in claims:
                      if 'P582' not in (c.get('qualifiers') or {}):
                          active.append(c)
                  use=active or claims
                  if not use:return None
                  val=use[-1].get('mainsnak',{}).get('datavalue',{}).get('value',{})
                  qid=val.get('id') if isinstance(val,dict) else None
                  if not qid:return None
                  lurl='https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&props=labels&languages=en|es&ids='+urllib.parse.quote(qid)
                  labels=json.loads(get(lurl)).get('entities',{}).get(qid,{}).get('labels',{})
                  return (labels.get('es') or labels.get('en') or {}).get('value')
              except Exception:
                  return None

          def resolve(club):
              # Wikipedia infobox tends to reflect managerial changes faster.
              name=wikipedia_search(club,'en') or wikipedia_search(club,'es')
              if name:return club,name
              name=wikidata_manager(club)
              return club,name

          missing=[c for c in all_clubs if c not in managers]
          with ThreadPoolExecutor(max_workers=3) as ex:
              futures=[ex.submit(resolve,c) for c in missing]
              for fut in as_completed(futures):
                  club,name=fut.result()
                  if name:managers[club]=name

          unresolved=[c for c in all_clubs if c not in managers]
          for c in unresolved:managers[c]='Entrenador actual'

          out={
              'v':3,'generated':'2026-10-01','count':len(all_clubs),
              'resolved':len(all_clubs)-len(unresolved),'fallback':len(unresolved),
              'managers':{c:managers[c] for c in all_clubs}
          }
          map_path.write_text(json.dumps(out,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('clubs',len(all_clubs),'resolved',out['resolved'],'fallback',out['fallback'])
          print('unresolved',unresolved)
          print('Athletic ->',managers.get('Athletic Club'))
          PY

      - name: Commit manager map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manager-career/data/manager-map.json
          git diff --cached --quiet && exit 0
          git commit -m "Complete current manager map"
          git pull --rebase origin main
          git push origin HEAD:main
