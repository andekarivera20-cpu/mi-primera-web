name: Build Manager Career Manager Map

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-manager-career-managers.yml'
      - 'manager-career/data/clubs-lite.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fill current manager map safely
        run: |
          python - <<'PY'
          import csv, io, json, re, time, unicodedata, urllib.request, urllib.parse, html as htmlmod
          from difflib import SequenceMatcher
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          clubs_data=json.loads(Path('manager-career/data/clubs-lite.json').read_text(encoding='utf-8'))
          map_path=Path('manager-career/data/manager-map.json')
          old=json.loads(map_path.read_text(encoding='utf-8')) if map_path.exists() else {'managers':{}}
          managers={k:v for k,v in (old.get('managers') or {}).items() if v and v!='Entrenador actual'}

          league_country={
            '1':'Denmark','4':'Belgium','10':'Netherlands','13':'England','14':'England',
            '16':'France','17':'France','19':'Germany','20':'Germany','31':'Italy','32':'Italy',
            '41':'Norway','50':'Scotland','53':'Spain','54':'Spain','56':'Sweden',
            '65':'Republic of Ireland','66':'Poland','68':'Turkey','80':'Austria',
            '189':'Switzerland','308':'Portugal','330':'Romania'
          }

          # Official/current overrides for clubs that were unresolved in the provider bridge.
          overrides={
            'Athletic Club':'Edin Terzić',
            'Arsenal FC':'Mikel Arteta',
            'FC Barcelona':'Hansi Flick',
            'Chelsea FC':'Xabi Alonso',
            'Crystal Palace':'Pierre Sage',
            'Everton FC':'David Moyes',
            'Manchester City':'Enzo Maresca'
          }
          managers.update(overrides)

          def norm(s):
              s=unicodedata.normalize('NFKD',s or '').encode('ascii','ignore').decode().lower()
              s=s.replace('&',' and ').replace("'",'')
              s=re.sub(r'\b(football club|futbol club|futebol clube|club de futbol|club|fc|cf|sc|ac|afc|rcd|rc|cd|ud|sv|vfb|vfl|calcio)\b',' ',s)
              s=re.sub(r'\b(18|19|20)\d{2}\b',' ',s)
              s=re.sub(r'[^a-z0-9]+',' ',s)
              return re.sub(r'\s+',' ',s).strip()

          def score(a,b):
              A,B=norm(a),norm(b)
              if not A or not B:return 0
              if A==B:return 1
              if A in B or B in A:return .88+.1*min(len(A),len(B))/max(len(A),len(B))
              return SequenceMatcher(None,A,B).ratio()

          def get(url,timeout=40):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 ManagerCareer/1.0','Accept':'application/json,text/plain,*/*'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read().decode('utf-8','replace')

          all_clubs=[]
          club_country={}
          for lid,rows in clubs_data.get('leagues',{}).items():
              for row in rows:
                  c=row[0]
                  all_clubs.append(c)
                  club_country[c]=league_country.get(lid,'')

          missing=[c for c in all_clubs if c not in managers]

          # Small targeted SofaScore pass only for unresolved clubs.
          def direct_manager(club):
              target=club
              for attempt in range(2):
                  try:
                      url='https://www.sofascore.com/api/v1/search/all?q='+urllib.parse.quote(target)
                      j=json.loads(get(url,25))
                      items=j if isinstance(j,list) else (j.get('results') or j.get('entities') or [])
                      best=None;best_sc=0
                      for item in items:
                          ent=item.get('entity',item) if isinstance(item,dict) else {}
                          if not isinstance(ent,dict):continue
                          typ=(item.get('type') if isinstance(item,dict) else '') or ent.get('type') or ''
                          if typ and str(typ).lower() not in {'team','club'}:continue
                          tid=ent.get('id');nm=ent.get('name') or ''
                          if not tid or not nm:continue
                          sc=score(target,nm)
                          if sc>best_sc:best=(tid,nm);best_sc=sc
                      if best and best_sc>=.62:
                          raw=get('https://www.sofascore.com/api/v1/team/'+str(best[0]),25)
                          tj=json.loads(raw);team=tj.get('team',tj)
                          if isinstance(team,dict) and score(target,team.get('name') or best[1])>=.58:
                              mgr=team.get('manager')
                              name=(mgr.get('name') or mgr.get('shortName') or '').strip() if isinstance(mgr,dict) else ((mgr or '').strip() if isinstance(mgr,str) else '')
                              if name:return club,name
                  except Exception:
                      time.sleep(.8+attempt*.8)
              return club,None

          if missing:
              with ThreadPoolExecutor(max_workers=2) as ex:
                  futs=[ex.submit(direct_manager,c) for c in missing]
                  for fut in as_completed(futs):
                      club,name=fut.result()
                      if name:managers[club]=name

          missing=[c for c in all_clubs if c not in managers]

          teams_csv=get('https://raw.githubusercontent.com/withqwerty/reep/main/data/teams.csv',120)
          rr=csv.DictReader(io.StringIO(teams_csv))
          rows=[]
          by_country={}
          for r in rr:
              name=(r.get('name') or '').strip()
              qid=(r.get('key_wikidata') or '').strip()
              if not name or not qid:continue
              rec={'name':name,'qid':qid,'country':(r.get('country') or '').strip()}
              rows.append(rec)
              by_country.setdefault(rec['country'],[]).append(rec)

          aliases={
            'RC Celta':'Celta Vigo','RC Deportivo A Coruña':'Deportivo La Coruña',
            'Real Sporting de Gijón':'Sporting Gijón','Aarhus Gymnastikforening':'AGF',
            'FC København':'FC Copenhagen','Odense Boldklub':'OB','Sønderjyske Fodbold':'Sonderjyske',
            'Sporting Clube de Braga':'Braga','Vitória SC':'Vitória Guimarães',
            'Grasshopper Club Zürich':'Grasshoppers','FK Bodø/Glimt':'Bodø/Glimt',
            'Asociația Clubul Sportiv Petrolul 52':'Petrolul Ploiesti'
          }

          club_qid={}
          for club in missing:
              target=aliases.get(club,club)
              pool=by_country.get(club_country.get(club,''),[]) or rows
              best=max(pool,key=lambda r:score(target,r['name']),default=None)
              sc=score(target,best['name']) if best else 0
              if best and sc>=.68:club_qid[club]=best['qid']

          # Resolve Wikipedia sitelinks in batches.
          qids=sorted(set(club_qid.values()))
          sitelinks={}
          for i in range(0,len(qids),40):
              batch=qids[i:i+40]
              try:
                  url='https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&props=sitelinks&sitefilter=enwiki|eswiki&ids='+urllib.parse.quote('|'.join(batch))
                  ents=json.loads(get(url)).get('entities',{})
                  for q,obj in ents.items():
                      sl=obj.get('sitelinks') or {}
                      if sl.get('enwiki'):sitelinks[q]=('en',sl['enwiki']['title'])
                      elif sl.get('eswiki'):sitelinks[q]=('es',sl['eswiki']['title'])
              except Exception:
                  pass

          def clean_wiki_value(v):
              v=re.sub(r'<ref[^>]*>.*?</ref>','',v,flags=re.I|re.S)
              v=re.sub(r'<ref[^>]*/>','',v,flags=re.I)
              # Preserve the useful final parameter of simple formatting templates.
              for _ in range(5):
                  nv=re.sub(r'\{\{[^{}]*?\|\s*([^{}|]+(?:\[\[[^{}]+?\]\])?[^{}|]*)\}\}',lambda m:m.group(1),v)
                  if nv==v:break
                  v=nv
              v=re.sub(r'\{\{[^{}]+\}\}','',v)
              v=re.sub(r'\[\[([^\]|]+)\|([^\]]+)\]\]',r'\2',v)
              v=re.sub(r'\[\[([^\]]+)\]\]',r'\1',v)
              v=re.sub(r'<[^>]+>','',v)
              v=v.replace("'''",'').replace("''",'')
              v=htmlmod.unescape(v)
              v=re.sub(r'\s+',' ',v).strip(' |')
              return v

          def wiki_manager(club):
              q=club_qid.get(club)
              if not q or q not in sitelinks:return club,None
              lang,title=sitelinks[q]
              host='en.wikipedia.org' if lang=='en' else 'es.wikipedia.org'
              try:
                  url='https://'+host+'/w/api.php?action=query&format=json&formatversion=2&prop=revisions&rvprop=content&rvslots=main&titles='+urllib.parse.quote(title)
                  j=json.loads(get(url,30))
                  pages=j.get('query',{}).get('pages',[])
                  if not pages:return club,None
                  revs=pages[0].get('revisions') or []
                  if not revs:return club,None
                  slots=revs[0].get('slots') or {}
                  text=(slots.get('main') or {}).get('content') or revs[0].get('*') or ''
                  patterns=[
                    r'^\|\s*manager\s*=\s*(.+)$',
                    r'^\|\s*head[_ ]coach\s*=\s*(.+)$',
                    r'^\|\s*coach\s*=\s*(.+)$',
                    r'^\|\s*entrenador\s*=\s*(.+)$'
                  ]
                  for pat in patterns:
                      m=re.search(pat,text,flags=re.I|re.M)
                      if m:
                          name=clean_wiki_value(m.group(1))
                          if name and len(name)<100 and name.lower() not in {'vacant','none','n/a','-'}:
                              return club,name
              except Exception:
                  pass
              return club,None

          with ThreadPoolExecutor(max_workers=5) as ex:
              futs=[ex.submit(wiki_manager,c) for c in missing if c not in managers]
              for fut in as_completed(futs):
                  club,name=fut.result()
                  if name:managers[club]=name

          # Preserve every club key. Anything still missing is explicitly flagged for later manual review.
          unresolved=[c for c in all_clubs if c not in managers]
          for c in unresolved:managers[c]='Entrenador actual'

          out={
              'v':2,'generated':'2026-10-01','count':len(managers),
              'resolved':len(all_clubs)-len(unresolved),'fallback':len(unresolved),
              'managers':managers
          }
          map_path.write_text(json.dumps(out,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('clubs',len(all_clubs),'resolved',out['resolved'],'fallback',out['fallback'])
          print('unresolved',unresolved)
          print('Athletic',managers.get('Athletic Club'),'Arsenal',managers.get('Arsenal FC'),'Barcelona',managers.get('FC Barcelona'))
          if out['resolved']<300:raise SystemExit('Manager coverage regressed below safe baseline')
          PY

      - name: Commit manager map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manager-career/data/manager-map.json
          git diff --cached --quiet && exit 0
          git commit -m "Complete current manager map"
          git push

# targeted unresolved-manager refresh
